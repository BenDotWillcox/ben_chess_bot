name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build production image
        run: docker build --tag benbot:ci .

  unit-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -m "not browser" -q
      - run: python -m compileall -q api tests *.py

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: Start lightweight browser-smoke server
        run: |
          python tests/browser_server.py > browser-server.log 2>&1 &
          echo $! > browser-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat browser-server.log
          exit 1
      - name: Run external API smoke game
        run: >-
          python smoke_api.py
          --base-url http://127.0.0.1:8765
          --timeout 30
          --allow-degraded-stockfish
      - run: python -m pytest -m browser tests/test_browser_smoke.py -q
        env:
          CHESS_BOT_TEST_BASE_URL: http://127.0.0.1:8765
      - name: Exercise runtime benchmark harness with dependency fakes
        run: >-
          python benchmark_runtime.py
          --base-url http://127.0.0.1:8765
          --warmup-requests 1
          --warm-requests 2
          --requests 8
          --concurrency 4
          --output runtime-benchmark-ci-fake.json
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-benchmark-ci-fake
          path: runtime-benchmark-ci-fake.json
          retention-days: 7
      - name: Print server log on failure
        if: failure()
        run: cat browser-server.log
